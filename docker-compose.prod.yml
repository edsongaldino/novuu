services:
  db:
    image: postgres:15
    container_name: novuu_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${NOVUU_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${NOVUU_DB_PASSWORD}
      POSTGRES_DB: ${NOVUU_DB_NAME:-lancamentos}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    networks:
      - novuu_network

  api:
    image: ghcr.io/edsongaldino/novuu-api:main
    container_name: novuu_api_prod
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=${NOVUU_CONNECTION_STRING}
      - CdnBaseUrl=${NOVUU_CDN_URL}
      - SpacesAccessKey=${NOVUU_SPACES_KEY}
      - SpacesSecretKey=${NOVUU_SPACES_SECRET}
      - SpacesBucket=${NOVUU_SPACES_BUCKET}
    depends_on:
      - db
    networks:
      - novuu_network
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.novuu-api.rule=Host(`api.novuu.com.br`)"
      - "traefik.http.routers.novuu-api.entrypoints=websecure"
      - "traefik.http.routers.novuu-api.tls.certresolver=le"
      - "traefik.http.services.novuu-api.loadbalancer.server.port=8080"
      # Redireciona HTTP para HTTPS
      - "traefik.http.middlewares.novuu-redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.routers.novuu-api-http.rule=Host(`api.novuu.com.br`)"
      - "traefik.http.routers.novuu-api-http.entrypoints=web"
      - "traefik.http.routers.novuu-api-http.middlewares=novuu-redirect-to-https"
      - "traefik.docker.network=traefik_proxy"

  portal:
    image: ghcr.io/edsongaldino/novuu-portal:main
    container_name: novuu_portal_prod
    restart: always
    environment:
      - NODE_ENV=production
    networks:
      - novuu_network
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.novuu-portal.rule=Host(`novuu.com.br`) || Host(`www.novuu.com.br`)"
      - "traefik.http.routers.novuu-portal.entrypoints=websecure"
      - "traefik.http.routers.novuu-portal.tls.certresolver=le"
      - "traefik.http.services.novuu-portal.loadbalancer.server.port=4000" # SSR roda na 4000
      - "traefik.http.routers.novuu-portal-http.rule=Host(`novuu.com.br`) || Host(`www.novuu.com.br`)"
      - "traefik.http.routers.novuu-portal-http.entrypoints=web"
      - "traefik.http.routers.novuu-portal-http.middlewares=novuu-redirect-to-https"
      - "traefik.docker.network=traefik_proxy"

  painel:
    image: ghcr.io/edsongaldino/novuu-painel:main
    container_name: novuu_painel_prod
    restart: always
    networks:
      - novuu_network
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.novuu-painel.rule=Host(`painel.novuu.com.br`)"
      - "traefik.http.routers.novuu-painel.entrypoints=websecure"
      - "traefik.http.routers.novuu-painel.tls.certresolver=le"
      - "traefik.http.services.novuu-painel.loadbalancer.server.port=80" # SPA roda no nginx interno (80)
      - "traefik.http.routers.novuu-painel-http.rule=Host(`painel.novuu.com.br`)"
      - "traefik.http.routers.novuu-painel-http.entrypoints=web"
      - "traefik.http.routers.novuu-painel-http.middlewares=novuu-redirect-to-https"
      - "traefik.docker.network=traefik_proxy"

networks:
  novuu_network:
    driver: bridge
  traefik_proxy:
    external: true

volumes:
  pgdata_prod:
