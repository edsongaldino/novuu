<main class="hero-container" style="position: relative; overflow: hidden; background-color: #ffffff; min-height: calc(100vh - 80px); display: flex; flex-direction: column; align-items: center; justify-content: center; padding-bottom: 150px;">
  <!-- Giant Watermark -->
  <div style="position: absolute; top: 20%; left: 50%; transform: translateX(-50%); font-family: 'Inter', sans-serif; font-size: 70vh; font-weight: 900; color: #f8fafc; opacity: 0.7; z-index: 0; user-select: none; pointer-events: none; line-height: 1;">U</div>

  <div class="hero-content" style="position: relative; z-index: 10; width: 100%; max-width: 900px; display: flex; flex-direction: column; align-items: center;">
    <h1 class="hero-title" style="color: var(--primary-color); font-size: 3.5rem; font-weight: 800; text-align: center; margin-bottom: 40px; letter-spacing: -1px;">
      O que <span style="color: var(--accent-blue);">você</span> procura <span style="color: var(--accent-color);">hoje?</span>
    </h1>
    
    <form class="search-box" (submit)="submitSearch($event)" style="width: 100%; max-width: 800px; position: relative; margin-bottom: 60px;">
      <div class="search-input-wrapper" style="display: flex; align-items: center; background: white; border-radius: 50px; padding: 10px 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); border: 1px solid #f1f5f9;">
        <svg class="search-icon" viewBox="0 0 24 24" width="22" height="22" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" [value]="searchQuery()" (input)="onSearchInput($event)" (blur)="hideDropdown()" placeholder="Descreva o seu imóvel ideal..." aria-label="Buscar imóvel" style="flex: 1; border: none; outline: none; padding: 15px 20px; font-size: 1.1rem; color: var(--primary-color); background: transparent;" />
        <button type="submit" class="voice-search-btn" aria-label="Pesquisa Inteligente" style="background: transparent; color: inherit; display: flex; align-items: center; justify-content: center; border: none; outline: none; cursor: pointer; padding-left: 10px; flex-shrink: 0;">
          <span style="font-weight: 900; font-family: 'Inter', sans-serif; font-size: 24px; letter-spacing: -2px;"><span style="color: var(--accent-blue)">U</span><span style="color: var(--accent-color)">U</span></span>
        </button>
      </div>
      
      <!-- Autocomplete Dropdown List -->
      @if (showDropdown()) {
        <div class="autocomplete-dropdown">
          @for (item of autocompleteResults(); track item.id + '-' + item.tipo) {
            <button type="button" class="autocomplete-item" (mousedown)="selectSuggestion(item)">
              <span class="suggestion-text">{{ item.texto }}</span>
              <span class="suggestion-type-badge" [class]="item.tipo.toLowerCase()">{{ item.tipo }}</span>
            </button>
          }
        </div>
      }
    </form>
    
    <div class="suggestions-section" style="width: 100%;">
      <h2 class="suggestions-title" style="font-size: 0.7rem; letter-spacing: 2px; color: var(--primary-color); text-transform: uppercase; font-weight: 800; margin-bottom: 30px; display: flex; flex-direction: column; align-items: center;">
        EXPERIMENTE PERGUNTAR
        <span style="width: 30px; height: 2px; background: var(--accent-color); margin-top: 10px; display: inline-block;"></span>
      </h2>
      
      <div class="suggestions-grid" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; width: 100%;">
        
        <button type="button" class="suggestion-chip" (click)="selectSuggestionText('Residenciais')" style="background: white; border: 1px solid #e2e8f0; border-radius: 8px; padding: 18px 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); display: flex; align-items: center; justify-content: space-between; gap: 12px; transition: all 0.2s ease;">
          <span class="chip-icon" style="color: var(--accent-blue); display: flex; flex-shrink: 0;">
            <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="1.5" fill="none"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect><path d="M9 22v-4h6v4"></path><path d="M8 6h.01"></path><path d="M16 6h.01"></path><path d="M12 6h.01"></path><path d="M12 10h.01"></path><path d="M12 14h.01"></path><path d="M16 10h.01"></path><path d="M16 14h.01"></path><path d="M8 10h.01"></path><path d="M8 14h.01"></path></svg>
          </span>
          <span class="chip-text" style="font-size: 0.8rem; font-weight: 500; text-align: left; flex: 1; color: var(--primary-color); line-height: 1.4;">Lançamentos<br/>Residenciais</span>
          <span class="chip-arrow" style="color: var(--accent-color); flex-shrink: 0;">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </span>
        </button>
        
        <button type="button" class="suggestion-chip" (click)="selectSuggestionText('Lotes e Terrenos')" style="background: white; border: 1px solid #e2e8f0; border-radius: 8px; padding: 18px 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); display: flex; align-items: center; justify-content: space-between; gap: 12px; transition: all 0.2s ease;">
          <span class="chip-icon" style="color: var(--accent-blue); display: flex; flex-shrink: 0;">
            <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="1.5" fill="none"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
          </span>
          <span class="chip-text" style="font-size: 0.8rem; font-weight: 500; text-align: left; flex: 1; color: var(--primary-color); line-height: 1.4;">Lotes e<br/>Terrenos</span>
          <span class="chip-arrow" style="color: var(--accent-color); flex-shrink: 0;">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </span>
        </button>
        
        <button type="button" class="suggestion-chip" (click)="selectSuggestionText('Até R$ 500 mil')" style="background: white; border: 1px solid #e2e8f0; border-radius: 8px; padding: 18px 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); display: flex; align-items: center; justify-content: space-between; gap: 12px; transition: all 0.2s ease;">
          <span class="chip-icon" style="color: var(--accent-blue); display: flex; flex-shrink: 0;">
            <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="1.5" fill="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
          </span>
          <span class="chip-text" style="font-size: 0.8rem; font-weight: 500; text-align: left; flex: 1; color: var(--primary-color); line-height: 1.4;">Até<br/>R$ 500 mil</span>
          <span class="chip-arrow" style="color: var(--accent-color); flex-shrink: 0;">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </span>
        </button>
        
        <button type="button" class="suggestion-chip" (click)="selectSuggestionText('Alto Padrão')" style="background: white; border: 1px solid #e2e8f0; border-radius: 8px; padding: 18px 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); display: flex; align-items: center; justify-content: space-between; gap: 12px; transition: all 0.2s ease;">
          <span class="chip-icon" style="color: var(--accent-blue); display: flex; flex-shrink: 0;">
            <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="1.5" fill="none"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
          </span>
          <span class="chip-text" style="font-size: 0.8rem; font-weight: 500; text-align: left; flex: 1; color: var(--primary-color); line-height: 1.4;">Imóveis de<br/>Alto Padrão</span>
          <span class="chip-arrow" style="color: var(--accent-color); flex-shrink: 0;">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </span>
        </button>
      </div>
    </div>
  </div>
  
  <!-- Skyline background illustration -->
  <div class="skyline-container">
    <svg class="skyline-svg" viewBox="0 0 1440 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M 0 200 L 0 180 L 30 180 L 30 140 L 70 140 L 70 160 L 120 160 L 120 120 L 160 120 L 160 170 L 210 170 L 210 130 L 240 130 L 240 150 L 300 150 L 300 110 L 350 110 L 350 165 L 390 165 L 390 140 L 440 140 L 440 160 L 480 160 L 480 90 L 530 90 L 530 175 L 590 175 L 590 120 L 640 120 L 640 150 L 690 150 L 690 100 L 730 100 L 730 165 L 790 165 L 790 130 L 830 130 L 830 150 L 880 150 L 880 80 L 940 80 L 940 170 L 1000 170 L 1000 120 L 1050 120 L 1050 145 L 1100 145 L 1100 110 L 1150 110 L 1150 160 L 1200 160 L 1200 135 L 1250 135 L 1250 155 L 1310 155 L 1310 95 L 1370 95 L 1370 180 L 1440 180 L 1440 200 Z" fill="#e2e8f0" opacity="0.3" />
      <path d="M 0 200 L 0 190 L 50 190 L 50 160 L 90 160 L 90 175 L 150 175 L 150 140 L 190 140 L 190 180 L 250 180 L 250 150 L 290 150 L 290 165 L 340 165 L 340 130 L 380 130 L 380 175 L 430 175 L 430 155 L 470 155 L 470 170 L 520 170 L 520 110 L 570 110 L 570 180 L 630 180 L 630 140 L 680 140 L 680 160 L 720 160 L 720 120 L 760 120 L 760 175 L 820 175 L 820 145 L 860 145 L 860 160 L 910 160 L 910 100 L 970 100 L 970 175 L 1030 175 L 1030 135 L 1080 135 L 1080 155 L 1130 155 L 1130 120 L 1180 120 L 1180 170 L 1230 170 L 1230 150 L 1270 150 L 1270 165 L 1330 165 L 1330 115 L 1390 115 L 1390 185 L 1440 185 L 1440 200 Z" fill="#cbd5e1" opacity="0.4" stroke="#94a3b8" stroke-width="0.5" />
    </svg>
  </div>
</main>
